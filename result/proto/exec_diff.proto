syntax = "proto3";

package execlog_diff;

import "diagnostic/diagnostic.proto";

enum Reason {
  ADDED = 0;
  REMOVED = 1;
  CHANGED = 2;
}

message EnvVarChange {
  string key = 1;
  string old_value = 2;
  string new_value = 3;
}

message ArgChange {
  string old_arg = 1;
  string new_arg = 2;
  int64 old_arg_index = 3;
  int64 new_arg_index = 4;
}

message InputFileChange {
  string path = 1;
  int64 size_bytes = 2;
}

message OutputFileChange {
  string path = 1;
  int64 size_bytes = 2;
}

message InputItem {
  /**
  * Why has this input changed?
  *  - Added: This is a new input
  *  - Removed: This input has been removed
  *  - Changed: This input has changed
  */
  Reason reason = 1;

  oneof item {
    EnvVarChange env_var_changes = 2;

    ArgChange arg_list_changes = 3;

    InputFileChange input_file_list_changes = 4;

    OutputFileChange output_file_list_changes = 5;
  }
}

/**
 * ActionGraphDiffEdge represents a connection between two ActionGraphDiffNodes.
 * It describes the addition of, removal of or change of input files between the two nodes.
 */
message ActionGraphDiffEdge {
  /**
   * The spawn hash of the child. The hash can be used to lookup the child in the root list of nodes
   */
   string child = 1;

  /**
   * Which files have changed between nodes (bazel spawns)
   *  - Item should only ever be of InputFileChange in this case
   */
   repeated InputItem changed_files = 2;

   /**
    * Why is this edge being shown?
    *  - Added: This is a new edge in the graph
    *  - Removed: This edge is no longer present
    *  - Changed: This edge existed previously and continues to exist.
    *       - Means there is some kind of change in the files connecting one spawn to another
    */
   Reason reason = 3;
}

/**
 * ActionGraphDiffNode represents a bazel spawn action that has been changed in some way between 2 bazel invocations.
 */
message ActionGraphDiffNode {
  /**
   * A unique identifier for each spawned action.
   */
  string action_hash = 1;

  /**
   * The bazel label for the target which spawned the action.
   */
  string target_label = 2;

  /**
   * Why has this spawn been listed as changed?
   *  - Added: This is a new spawn in the graph
   *  - Removed: This spawn is no longer in the graph
   *  - Changed: Something about this spawn has changed. This could be more than one thing. 
   */
  Reason reason = 3;

  /**
   * What has changed about this node (bazel action)
   */
  repeated InputItem changes = 4;

  /**
   * General diagnostics about this node (bazel action)
   *  - Is this spawn not cacheable?
   *  - Did this spawn take 2 seconds one run and then 34 seconds for the second run? Something might be wrong here
   */
  repeated ohno.Diagnostic diagnostics = 5;

  /**
   * References to children
   */
  repeated ActionGraphDiffEdge children = 6;

  /**
   * Is the result being saved to the remote cache
   */
  bool remote_cachable = 7;
}

message ExecDiff {
  /**
   * Diagnostics containing general information about the execlogs. Not tied to a specific spawn
   */
  repeated ohno.Diagnostic diagnostics = 1;

  /**
   * Graph nodes
   */
  repeated ActionGraphDiffNode nodes = 2;

  /**
   * A list of action_hashes that can be used to lookup nodes from "nodes".
   * When displaying output as trees/graphs you will need some top level starting points
   */
  repeated string root_nodes = 3;
}

message Label {
  string target_label = 1;
  bool cache_hit = 2;
  bool remoteable = 3;
  bool cacheable = 4;
  bool remote_cacheable = 5;
  repeated ohno.Diagnostic diagnostics = 6;
}

message ListLabelsQuery {
  repeated Label labels = 1;
}

message Result {
  /**
   * Different possible result types
   */
  oneof result {
    ExecDiff exec_diff = 1;
    ListLabelsQuery label_query = 3;
  }
}

message ExecLogDiffResult {
  /**
   * Any runtime errors that occured
   */
  repeated ohno.Diagnostic runtime_diagnostics = 1;

  /**
   * The result
   */
  Result result = 2;
}